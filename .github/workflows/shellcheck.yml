name: Shellcheck

on:
  push:
    branches: [main, develop, "**"]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: "warning"
          scan-glob: "**/*.sh"
          name: "retro-linux-shellcheck"
          check shelcheckrc: true
          exit-zero: false

      - name: Upload scanning results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shellcheck-results
          path: shellcheck.sarif
          retention-days: 30
