name: ISO Release (Develop)

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build ISO
        env:
          RETRO_DIR: ${{ github.workspace }}
        run: |
          chmod +x ./iso/build.sh
          ./iso/build.sh -y

      - name: Find ISO
        id: iso
        run: |
          shopt -s nullglob
          iso_files=(iso/out/*.iso)
          if [[ ${#iso_files[@]} -eq 0 ]]; then
            echo "ERROR: No ISO found in iso/out/"
            ls -la iso/out/ || true
            exit 1
          fi
          echo "filename=${iso_files[0]##*/}" >> $GITHUB_OUTPUT
          echo "Full path: ${iso_files[0]}"

      - name: Create Release Notes
        run: |
          cat > release_notes.md << EOF
          ## ⚠️ Unstable Development Build

          **This is an UNSTABLE development build of RetroLinux ISO.**

          **This image is NOT recommended for production use.**

          ### Disclaimer
          While this image may work fine, it is an unstable development snapshot. Use at your own risk. Production environments should only use official stable releases.

          ### Build Info
          - **Commit:** \`${{ github.sha }}\`
          - **Branch:** develop
          - **Date:** $(date '+%Y-%m-%d')

          ---
          *Generated by GitHub Actions*
          EOF

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release delete develop-latest --yes || true
          gh release create develop-latest \
            --title "RetroLinux ISO (Develop)" \
            --notes-file release_notes.md \
            --repo "${{ github.repository }}" \
            "iso/out/${{ steps.iso.outputs.filename }}"