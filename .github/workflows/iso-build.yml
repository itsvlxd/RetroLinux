name: ISO Build

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y bc imagemagick

      - name: Build ISO
        env:
          RETRO_DIR: ${{ github.workspace }}
        run: |
          cd ./iso && chmod +x build.sh
          ./build.sh -y 2>&1 || {
            echo "=== Build failed, checking logs ==="
            ls -la iso/out/ 2>/dev/null || true
            ls -la iso/work/ 2>/dev/null || true
            exit 1
          }

      - name: Find ISO
        id: iso
        run: |
          ISO_FILE=$(ls iso/out/*.iso | head -1)
          echo "filename=$(basename $ISO_FILE)" >> $GITHUB_OUTPUT
          echo "size=$(stat -c%s $ISO_FILE)" >> $GITHUB_OUTPUT

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: retrolinux-iso
          path: iso/out/*.iso
          retention-days: 5

  release-nightly:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --local user.email "ci@retrolinux.local"
          git config --local user.name "RetroLinux CI"

      - name: Delete existing nightly release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if gh release view nightly --repo ${{ github.repository }} 2>/dev/null; then
            gh release delete nightly --repo ${{ github.repository }} --yes
          fi
          gh tag delete nightly --force 2>/dev/null || true

      - name: Create nightly tag
        run: |
          git tag -fa nightly -m "RetroLinux Nightly Build"
          git push origin nightly --force

      - name: Download ISO
        uses: actions/download-artifact@v4
        with:
          name: retrolinux-iso
          path: iso/out/

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          files: iso/out/*.iso
          tag_name: nightly
          name: 'RetroLinux Nightly'
          body: |
            <div align="center">
              <img src="https://raw.githubusercontent.com/itsvlxd/RetroLinux/develop/assets/logo-palm-wide-transparent-bg.png" alt="RetroLinux" style="max-width:100%;">
            </div>

            ---

            <h1 align="center">Nightly Build</h1>

            <p align="center">
              <strong>This ISO is built from the latest <code>develop</code> branch and is not recommended for production use.</strong>
            </p>

            ---

            <h2>⚠️ Important Warnings</h2>

            <ul>
              <li>This build may contain bugs, regressions, or broken features that have not been fully tested.</li>
              <li>Do not use this build for production systems or any mission-critical tasks.</li>
              <li>Always backup your data before testing any pre-release software.</li>
              <li>Expect breaking changes between nightly builds. Configuration files and data may not be compatible with future versions.</li>
            </ul>

            ---

            <h2>About Nightly Builds</h2>

            <p>Nightly builds are automatically created from the latest code committed to the <code>develop</code> branch. These builds represent the current state of active development and may include unfinished features, recent bug fixes, performance improvements, and other changes that have not yet been validated for a stable release.</p>

            <p>If you encounter any issues, please report them on the <a href="https://github.com/itsvlxd/RetroLinux/issues">issue tracker</a>. Your feedback helps improve RetroLinux for everyone.</p>

            ---

            <h2>Who Should Use This?</h2>

            <p>Nightly builds are best suited for developers and contributors who want to test new features as they are being worked on, or for experienced users who are comfortable troubleshooting issues and providing detailed bug reports. If you need a stable, reliable system for daily use, please wait for an official stable release.</p>

            ---

            <h2>Stable Releases</h2>

            <p>For a tested, stable experience, please download official releases from the <a href="https://github.com/itsvlxd/RetroLinux/releases">Releases page</a>. Stable releases have been thoroughly tested and are recommended for most users.</p>

            ---

            <h2>Quick Links</h2>

            <ul>
              <li><a href="https://github.com/itsvlxd/RetroLinux/issues/new?labels=bug">Report a Bug</a></li>
              <li><a href="https://github.com/itsvlxd/RetroLinux/issues/new?labels=enhancement">Request a Feature</a></li>
              <li><a href="https://github.com/itsvlxd/RetroLinux/wiki">Documentation</a></li>
            </ul>

            ---

            <h2>Build Information</h2>

            <ul>
              <li><strong>Commit:</strong> <code>${{ github.sha }}</code></li>
              <li><strong>Built:</strong> ${{ github.event.head_commit.timestamp }}</li>
              <li><strong>Branch:</strong> <code>develop</code></li>
            </ul>

            ---

            <p align="center"><em>RetroLinux is under active development.</em></p>
          draft: false
          prerelease: false
          overwrite: true
          token: ${{ secrets.GH_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
