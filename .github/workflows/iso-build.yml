name: ISO Build

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      kernel: ${{ steps.iso.outputs.kernel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y bc imagemagick jq

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Pull Docker image
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/retrolinux-build:latest || echo "Image not found, build may fail"
          docker tag ghcr.io/${{ github.repository_owner }}/retrolinux-build:latest retrolinux-build:latest 2>/dev/null || true

      - name: Build ISO
        env:
          RETRO_DIR: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          cd ./iso && chmod +x build.sh
          ./build.sh -y 2>&1 || {
            echo "=== Build failed, checking logs ==="
            ls -la iso/out/ 2>/dev/null || true
            ls -la iso/work/ 2>/dev/null || true
            exit 1
          }

      - name: Find ISO
        id: iso
        run: |
          ISO_FILE=$(ls iso/out/*.iso | head -1)
          KERNEL_VERSION=$(cat iso/out/kernel-version.txt 2>/dev/null || echo "unknown")
          echo "filename=$(basename $ISO_FILE)" >> $GITHUB_OUTPUT
          echo "size=$(stat -c%s $ISO_FILE)" >> $GITHUB_OUTPUT
          echo "kernel=$KERNEL_VERSION" >> $GITHUB_OUTPUT

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: retrolinux-iso
          path: iso/out/*.iso
          retention-days: 5

  release-nightly:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --local user.email "ci@retrolinux.local"
          git config --local user.name "RetroLinux CI"

      - name: Delete existing nightly release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if gh release view nightly-build --repo ${{ github.repository }} 2>/dev/null; then
            gh release delete nightly-build --repo ${{ github.repository }} --yes
          fi
          gh tag delete nightly-build --force 2>/dev/null || true

      - name: Create nightly tag
        run: |
          git tag -fa nightly-build -m "RetroLinux Nightly Build"
          git push origin nightly-build --force

      - name: Download ISO
        uses: actions/download-artifact@v4
        with:
          name: retrolinux-iso
          path: iso/out/

      - name: Generate Release Notes
        env:
          KERNEL_VERSION: ${{ needs.build.outputs.kernel }}
        run: |
          cat > release_body.md << ENDOFFILE
          <p align="center">
            <img src="https://raw.githubusercontent.com/itsvlxd/RetroLinux/develop/assets/retrolinux-simple-nightly-logo.png" alt="RetroLinux" width="1200">
          </p>

          <p align="center">
            This ISO is built from the latest <code>develop</code> branch.<br>
            It is <strong>not recommended for production use</strong>.
          </p>

          <p align="center">
            <img src="https://img.shields.io/badge/Kernel-${KERNEL_VERSION}-0a0a0a?style=for-the-badge&labelColor=0a0a0a&color=F93BF3&logo=linux">
            <img src="https://img.shields.io/badge/Platform-x86__64-0a0a0a?style=for-the-badge&labelColor=0a0a0a&color=FA8AF4">
            <img src="https://img.shields.io/github/actions/workflow/status/itsvlxd/RetroLinux/tests.yml?branch=develop&label=Tests&style=for-the-badge&labelColor=0a0a0a">
            <img src="https://img.shields.io/github/actions/workflow/status/itsvlxd/RetroLinux/iso-build.yml?branch=develop&label=Build&style=for-the-badge&labelColor=0a0a0a">
            <img src="https://img.shields.io/github/downloads/itsvlxd/RetroLinux/total?style=for-the-badge&labelColor=0a0a0a&color=FA8AF4">
          </p>

          ### ⚠️ Warnings

          This build may contain bugs, regressions, or broken features that have not been fully tested. Do not use this build for production systems or any mission-critical tasks. Always backup your data before testing any pre-release software. Expect breaking changes between nightly builds.

          ### 💻 About

          Nightly builds are automatically created from the latest code committed to the <code>develop</code> branch. They represent the current state of active development and may include unfinished features, recent bug fixes, performance improvements, and other changes that have not yet been validated for a stable release.

          If you encounter any issues, please report them on the [issue tracker](https://github.com/itsvlxd/RetroLinux/issues). Your feedback helps improve RetroLinux for everyone.

          Nightly builds are best suited for developers and contributors who want to test new features as they are being worked on, or for experienced users who are comfortable troubleshooting issues and providing detailed bug reports.

          For a stable, reliable system for daily use, please wait for an official stable release and download it from the [Releases page](https://github.com/itsvlxd/RetroLinux/releases).

          [🐛 Report a Bug](https://github.com/itsvlxd/RetroLinux/issues/new?labels=bug) · [✨ Request a Feature](https://github.com/itsvlxd/RetroLinux/issues/new?labels=enhancement) · [📖 Documentation](https://github.com/itsvlxd/RetroLinux/wiki)

          **Commit:** ${{ github.sha }} · **Built:** ${{ github.event.head_commit.timestamp }}
          ENDOFFILE

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          files: iso/out/*.iso
          tag_name: nightly-build
          name: 'RetroLinux Nightly'
          body_path: release_body.md
          draft: false
          prerelease: true
          overwrite: true
          token: ${{ secrets.GH_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  release-stable:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config --local user.email "ci@retrolinux.local"
          git config --local user.name "RetroLinux CI"

      - name: Download ISO
        uses: actions/download-artifact@v4
        with:
          name: retrolinux-iso
          path: iso/out/

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Brand stable release body
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VERSION: ${{ steps.semantic.outputs.new_release_version }}
          KERNEL_VERSION: ${{ needs.build.outputs.kernel }}
        run: |
          RELEASE_TAG="v${VERSION}"
          notes=$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json body -q .body)
          cat > stable_body.md << ENDOFFILE
          <p align="center">
            <img src="https://raw.githubusercontent.com/itsvlxd/RetroLinux/main/assets/retrolinux-simple-logo.png" alt="RetroLinux" width="1200">
          </p>

          <p align="center">
            This ISO is a stable release built from the <code>main</code> branch.<br>
            Recommended for everyday use.
          </p>

          <p align="center">
            <img src="https://img.shields.io/badge/Kernel-${KERNEL_VERSION}-0a0a0a?style=for-the-badge&labelColor=0a0a0a&color=F93BF3&logo=linux">
            <img src="https://img.shields.io/badge/Platform-x86__64-0a0a0a?style=for-the-badge&labelColor=0a0a0a&color=FA8AF4">
            <img src="https://img.shields.io/github/actions/workflow/status/itsvlxd/RetroLinux/tests.yml?branch=main&label=Tests&style=for-the-badge&labelColor=0a0a0a">
            <img src="https://img.shields.io/github/actions/workflow/status/itsvlxd/RetroLinux/iso-build.yml?branch=main&label=Build&style=for-the-badge&labelColor=0a0a0a">
            <img src="https://img.shields.io/github/downloads/itsvlxd/RetroLinux/total?style=for-the-badge&labelColor=0a0a0a&color=FA8AF4">
          </p>

          ### 💻 About

          Stable releases are built from the <code>main</code> branch and contain only tested, production-ready changes. They are recommended for everyday use.

          If you encounter any issues, please report them on the [issue tracker](https://github.com/itsvlxd/RetroLinux/issues). Your feedback helps improve RetroLinux for everyone.

          Want the latest features and fixes? Try the [nightly release](https://github.com/itsvlxd/RetroLinux/releases/tag/nightly-build).

          [🐛 Report a Bug](https://github.com/itsvlxd/RetroLinux/issues/new?labels=bug) · [✨ Request a Feature](https://github.com/itsvlxd/RetroLinux/issues/new?labels=enhancement) · [📖 Documentation](https://github.com/itsvlxd/RetroLinux/wiki)

          **Commit:** ${{ github.sha }} · **Built:** ${{ github.event.head_commit.timestamp }}

          ### 📜 Changelog

          $notes
          ENDOFFILE
          gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --notes-file stable_body.md
