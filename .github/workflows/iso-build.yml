name: ISO Build

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y bc imagemagick

      - name: Build ISO
        env:
          RETRO_DIR: ${{ github.workspace }}
        run: |
          cd ./iso && chmod +x build.sh
          ./build.sh -y 2>&1 || {
            echo "=== Build failed, checking logs ==="
            ls -la iso/out/ 2>/dev/null || true
            ls -la iso/work/ 2>/dev/null || true
            exit 1
          }

      - name: Find ISO
        id: iso
        run: |
          ISO_FILE=$(ls iso/out/*.iso | head -1)
          echo "filename=$(basename $ISO_FILE)" >> $GITHUB_OUTPUT
          echo "size=$(stat -c%s $ISO_FILE)" >> $GITHUB_OUTPUT

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: retrolinux-iso
          path: iso/out/*.iso
          retention-days: 5

  release-nightly:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --local user.email "ci@retrolinux.local"
          git config --local user.name "RetroLinux CI"

      - name: Delete existing nightly release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if gh release view nightly --repo ${{ github.repository }} 2>/dev/null; then
            gh release delete nightly --repo ${{ github.repository }} --yes
          fi
          gh tag delete nightly --force 2>/dev/null || true

      - name: Create nightly tag
        run: |
          git tag -fa nightly -m "RetroLinux Nightly Build"
          git push origin nightly --force

      - name: Download ISO
        uses: actions/download-artifact@v4
        with:
          name: retrolinux-iso
          path: iso/out/

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          files: iso/out/*.iso
          tag_name: nightly
          name: 'RetroLinux Nightly'
          body: |
            # ⚠️ Nightly Build - Development Only ⚠️

            > **This ISO is NOT recommended for production use.**
            >
            > Nightly builds contain the latest code from the `develop` branch and may be unstable.

            ---

            ## 🚨 Warnings

            - ⚠️ This build may contain bugs, regressions, or broken features
            - ⚠️ Do not use for production or mission-critical tasks
            - ⚠️ Backup your data before testing
            - ⚠️ Expect breaking changes between nightly builds

            ---

            ## 📋 What's a Nightly Build?

            Nightly builds are automatically created from the latest code committed to the `develop` branch. They represent the current state of development and may include:

            - ✨ New features (possibly unfinished)
            - 🐛 Bug fixes
            - 🔧 Improvements and optimizations
            - 💥 Breaking changes

            ## 👤 Who Should Use This?

            - **Production/Daily Drive** → ❌ No - Use stable releases
            - **Developers/Contributors** → ✅ Yes - Test new features
            - **Power Users** → ⚠️ Only if you can handle issues
            - **Bug Reporters** → ✅ Yes - Help improve RetroLinux

            ---

            ## 📦 Stable Releases

            For a tested, stable experience, download official releases from the **[Releases page](https://github.com/itsvlxd/RetroLinux/releases)**.

            ---

            ## 🔗 Quick Links

            - [Report a Bug](https://github.com/itsvlxd/RetroLinux/issues/new?labels=bug)
            - [Request Feature](https://github.com/itsvlxd/RetroLinux/issues/new?labels=enhancement)

            ---

            **Build Info:**
            - Commit: `${{ github.sha }}`
            - Built: `${{ github.event.head_commit.timestamp }}`

            ---
            *RetroLinux is under active development*
          draft: false
          prerelease: true
          overwrite: true
          token: ${{ secrets.GH_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
