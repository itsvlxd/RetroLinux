# Style
set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# Settings
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "${TERM}"

# Index
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Prefix
unbind C-b
set -g prefix C-x
bind C-x send-prefix

# Keybinds
set-window-option -g mode-keys vi

unbind r 
bind r source-file ~/.config/tmux/tmux.conf

bind-key x kill-pane
bind-key & kill-window

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind -n M-H previous-window
bind -n M-L next-window

bind 'v' split-window -v -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'

set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-custom-paths '~/.config'
set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/.config'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-strategy-nvim 'session'

# FZF Integration
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# Custom menu
bind m display-menu -T "#[fg=blue,bold] 󱐋 Quick Actions " -x C -y C \
    "#[fg=green]󰐕  New Window"             n "new-window -c '#{pane_current_path}'" \
    "#[fg=green]󰓩  Split Right"            h "split-window -h -c '#{pane_current_path}'" \
    "#[fg=green]󰓩  Split Down"             v "split-window -v -c '#{pane_current_path}'" \
    "#[fg=brightblack]--------------------" "" "" \
    "#[fg=yellow]󰁌  Toggle Pane Zoom"      z "resize-pane -Z" \
    "#[fg=yellow]󰓦  Toggle Pane Sync"      y "set-option synchronize-panes" \
    "#[fg=yellow]󰐃  Swap with Master"       s "swap-pane -U" \
    "#[fg=brightblack]--------------------" "" "" \
    "#[fg=cyan]󰉋  Rename Window"          r "command-prompt -I '#W' 'rename-window %%'" \
    "#[fg=cyan]󰑐  Reload Config"          R "source-file ~/.config/tmux/tmux.conf; display 'Config Reloaded!'" \
    "#[fg=brightblack]--------------------" "" "" \
    "#[fg=red]󰆴  Kill Current Pane"      x "kill-pane" \
    "#[fg=red]󰆴  Kill Current Window"    k "kill-window"

# Status bar base style
set -g monitor-activity on
set -g visual-activity off
set -g status-style "bg=default,fg=default"
set -w -g window-status-style "bg=default,fg=default"
set -w -g window-status-current-style "bg=default,fg=default"
set -w -g window-status-activity-style "none"
set -w -g window-status-bell-style "none"

set -g status-position top
set -g status-justify left
set -g status-interval 5

set -g status-left-length 50
set -g status-left "#[bg=blue,fg=black,bold]  #S #[bg=default,fg=default] "

set -w -g window-status-separator " "
set -w -g window-status-format "#[bg=default,fg=brightblack]  #(~/.config/tmux/scripts/num_to_icon.sh win_inactive #I) #W #(~/.config/tmux/scripts/num_to_icon.sh pane_inactive #P)#{?window_zoomed_flag, #[fg=yellow]󱉶,}#{?window_activity_flag, #[fg=yellow]󰑐,} "
set -w -g window-status-current-format "#[bg=brightblack,fg=green]  #(~/.config/tmux/scripts/num_to_icon.sh win_active #I) #[fg=white]#W #[fg=white]#(~/.config/tmux/scripts/num_to_icon.sh pane_active #P)#{?window_zoomed_flag, #[fg=yellow]󱉶,} #[bg=default]"

set -g status-right-length 150
set -g status-right "#{?SSH_CLIENT,#[bg=red,fg=white,bold] 󰒋 #H #[bg=default] ,}#[bg=brightblack,fg=yellow] #(~/.config/tmux/scripts/cpu.sh)#(~/.config/tmux/scripts/battery.sh)#[bg=brightblack,fg=blue] 󰉋 #[fg=white]#{b:pane_current_path} #[bg=default] #[bg=brightblack,fg=cyan] 󰥔 #[fg=white]%H:%M #[bg=default]"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
