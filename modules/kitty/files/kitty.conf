#############
### Kitty ###
#############

# See https://sw.kovidgoyal.net/kitty/overview/#configuring-kitty

allow_remote_control yes
listen_on unix:/tmp/kitty

include ~/.config/retro/themes/kitty-colors.conf

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

symbol_map U+E000-U+F8FF JetBrainsMono Nerd Font

font_size 9.5

modify_font cell_width 105%
modify_font cell_height 95%

enable_audio_bell   no
scrollback_lines    10000

dynamic_background_opacity yes

tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style angled
tab_title_template  "{index}: {title}"

window_padding_width    5

confirm_os_window_close 0

detect_urls         yes
open_url_with       default
