[color]
foreground = '{{ colors.on_surface.default.hex }}'

gradient = 1
gradient_color_1 = '{{ colors.primary.default.hex }}'
gradient_color_2 = '{{ colors.secondary.default.hex }}'
gradient_color_3 = '{{ colors.tertiary.default.hex }}'

horizontal_gradient = 1
horizontal_gradient_color_1 = '{{ colors.primary.default.hex }}'
horizontal_gradient_color_2 = '{{ colors.primary_container.default.hex }}'
horizontal_gradient_color_3 = '{{ colors.tertiary.default.hex }}'

blend_direction = 'up'
