[config]
contrast = 0
base16_backend = "wal"
source_color_index = 0
type = "scheme-vibrant"

[templates.hyprland]
pre_hook = 'bash ~/.config/hypr/scripts/refresh_hyprland.sh'
input_path = '~/.config/matugen/templates/hyprland.lua'
output_path = '~/.config/retro/themes/hyprland-colors.lua'

[templates.hyprland-conf]
pre_hook = 'bash ~/.config/hypr/scripts/refresh_hyprland.sh'
input_path = '~/.config/matugen/templates/hyprland.conf'
output_path = '~/.config/retro/themes/hyprland-colors.conf'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.config/retro/themes/kitty-colors.conf'

[templates.colors-css]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/retro/themes/colors.css'

[templates.gtk2]
pre_hook = 'mkdir -p ~/.config/gtk-2.0'
input_path = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-2.0/gtk.css'

[templates.gtk3]
pre_hook = 'mkdir -p ~/.config/gtk-3.0'
input_path = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
pre_hook = 'mkdir -p ~/.config/gtk-4.0'
input_path = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.kvantum_kvconfig]
pre_hook = 'mkdir -p ~/.config/Kvantum/retro'
input_path = '~/.config/matugen/templates/kvantum.kvconfig'
output_path = '~/.config/Kvantum/retro/retro.kvconfig'

[templates.kvantum_svg]
pre_hook = 'mkdir -p ~/.config/Kvantum/matugen'
input_path = '~/.config/matugen/templates/kvantum.svg'
output_path = '~/.config/Kvantum/retro/retro.svg'

[templates.firefox]
input_path = "~/.config/matugen/templates/firefox.css"
output_path = "~/.config/retro/themes/firefox.css"

[templates.cava]
pre_hook = 'mkdir -p ~/.config/cava/themes'
input_path = '~/.config/matugen/templates/cava-colors.ini'
output_path = '~/.config/cava/themes/retro'

[templates.sddm]
pre_hook = 'mkdir -p ~/.config/retro/themes'
input_path = '~/.config/matugen/templates/sddm.conf'
output_path = '~/.config/retro/themes/sddm.conf'

[templates.shell-colors]
input_path = '~/.config/matugen/templates/shell-colors.json'
output_path = '~/.config/retro/themes/shell-colors.json'

[templates.spotify]
input_path = '~/.config/matugen/templates/spicetify.ini'
output_path = '~/.config/spicetify/Themes/Sleek/color.ini'
post_hook = 'pgrep -x spicetify > /dev/null || spicetify apply -n'
