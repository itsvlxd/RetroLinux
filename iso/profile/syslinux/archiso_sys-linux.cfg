LABEL arch
TEXT HELP
Boot the RetroLinux install medium on BIOS.
It allows you to install RetroLinux or perform system maintenance.
ENDTEXT
MENU LABEL RetroLinux install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash
