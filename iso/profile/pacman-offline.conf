#
# /etc/pacman.conf - Offline build configuration
#

[options]
Architecture = auto
HoldPkg     = pacman glibc
NoExtract   = usr/share/locale/*/* usr/share/doc/*/* usr/share/man/*/* usr/share/gtk-doc/*
Color
ILoveCandy
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Disable all network repos - we use offline repo only
NoUpdate    = *

[offline]
SigLevel = Optional TrustAll
Server = file:///var/cache/retrolinux/mirror/offline/

# Local package cache for newly downloaded packages
CacheDir = /var/cache/retrolinux/mirror/offline/
